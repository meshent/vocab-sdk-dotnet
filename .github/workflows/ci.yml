name: ci

# Builds, tests and packs the packages in the same dependency order release.yml publishes them: Vocab.Sdk
# first, then Vocab.Sdk.AspNetCore against that freshly packed Vocab.Sdk (a local feed beside nuget.org).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NUGET_ORG: https://api.nuget.org/v3/index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: echo "BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # 1. Vocab.Sdk
      - run: dotnet restore src/Vocab.Sdk && dotnet restore tests/Vocab.Sdk.Tests
      - run: dotnet build tests/Vocab.Sdk.Tests --configuration Release --no-restore "/p:Branch=${BRANCH}"
      - run: dotnet test tests/Vocab.Sdk.Tests --configuration Release --no-build --logger "trx;LogFileName=sdk.trx"
      - run: dotnet pack src/Vocab.Sdk --configuration Release --no-build --output artifacts/sdk "/p:Branch=${BRANCH}"

      # 2. Vocab.Sdk.AspNetCore, depending on exactly the Vocab.Sdk packed above (MSBuild reads
      #    VocabSdkPackageVersion from the environment), restored from that local feed
      - name: Point Vocab.Sdk.AspNetCore at the Vocab.Sdk just packed
        run: |
          nupkg=$(ls artifacts/sdk/Vocab.Sdk.*.nupkg)
          version=${nupkg#artifacts/sdk/Vocab.Sdk.}; version=${version%.nupkg}
          echo "VocabSdkPackageVersion=${version}" >> "$GITHUB_ENV"
          echo "Vocab.Sdk ${version}"
      - run: dotnet restore src/Vocab.Sdk.AspNetCore --source artifacts/sdk --source "$NUGET_ORG" && dotnet restore tests/Vocab.Sdk.AspNetCore.Tests --source artifacts/sdk --source "$NUGET_ORG"
      - run: dotnet build tests/Vocab.Sdk.AspNetCore.Tests --configuration Release --no-restore "/p:Branch=${BRANCH}"
      - run: dotnet test tests/Vocab.Sdk.AspNetCore.Tests --configuration Release --no-build --logger "trx;LogFileName=aspnetcore.trx"
      - run: dotnet pack src/Vocab.Sdk.AspNetCore --configuration Release --no-build --output artifacts/aspnetcore "/p:Branch=${BRANCH}"
      - name: Show the recorded Vocab.Sdk dependency
        run: unzip -p artifacts/aspnetcore/*.nupkg '*.nuspec' | grep -i 'dependency id="Vocab.Sdk"' | sort -u

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/**/*.nupkg
