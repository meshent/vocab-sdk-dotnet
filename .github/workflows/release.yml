name: release

# Publishes the packages to nuget.org.
#
# Versions are time based (see Directory.Build.props): every push to main publishes a release version
# such as 0.0.2479.12345; a manual run from any other branch publishes a prerelease tagged with the branch
# name, such as 0.0.2479.12345-wip-feature, for trying a change before it merges. The job refuses to
# publish a release version from anything but main.
#
# Authentication is NuGet Trusted Publishing: the job presents its GitHub OIDC token to nuget.org and gets a
# short-lived API key back, so no NuGet credential is stored anywhere. nuget.org needs a Trusted Publishing policy
# for this repository and this workflow file (owner, repository, `release.yml`, environment `nuget`), and the
# repository variable NUGET_USER must hold the nuget.org username that owns that policy.
# The `nuget` environment carries required reviewers, so every publish waits for a person. Actions are pinned to
# commit SHAs (Dependabot keeps them current). Runs are serialised so two publishes cannot race each other.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # lets the job request the OIDC token NuGet/login exchanges for a temporary key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Resolve the version for this branch
        # Evaluated once here and passed to build and pack as properties: every MSBuild evaluation would
        # otherwise read the clock again, and the two packages (and AspNetCore's dependency on Vocab.Sdk)
        # could be stamped with different half-seconds.
        run: |
          echo "BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          version=$(dotnet msbuild src/Vocab.Sdk/Vocab.Sdk.csproj -getProperty:Version "/p:Branch=${GITHUB_REF_NAME}")
          prefix=${version%%-*}
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "VERSION_BUILD=$(echo "$prefix" | cut -d. -f3)" >> "$GITHUB_ENV"
          echo "VERSION_REVISION=$(echo "$prefix" | cut -d. -f4)" >> "$GITHUB_ENV"
          echo "Publishing ${version} from ${GITHUB_REF_NAME}"
          case "$version" in
            *-*) [ "${GITHUB_REF_NAME}" != "main" ] || { echo "A main build must not carry a prerelease tag"; exit 1; } ;;
            *)   [ "${GITHUB_REF_NAME}" = "main" ] || { echo "Only main publishes release versions; ${GITHUB_REF_NAME} would publish ${version}"; exit 1; } ;;
          esac
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore "/p:Branch=${BRANCH}" "/p:VersionBuild=${VERSION_BUILD}" "/p:VersionRevision=${VERSION_REVISION}"
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build --output artifacts "/p:Branch=${BRANCH}" "/p:VersionBuild=${VERSION_BUILD}" "/p:VersionRevision=${VERSION_REVISION}"
      - name: Check that every package carries the resolved version
        run: |
          for nupkg in artifacts/*.nupkg; do
            case "$nupkg" in
              *".${VERSION}.nupkg") echo "ok  $nupkg" ;;
              *) echo "FAIL $nupkg is not version ${VERSION}"; exit 1 ;;
            esac
          done
      - name: Sign in to nuget.org with the workflow's OIDC token
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
