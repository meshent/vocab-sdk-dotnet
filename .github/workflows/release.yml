name: release

# Publishes the packages to nuget.org when a version tag is pushed (v0.1.0-preview.1, v1.2.0, ...).
# The tag must match the version in Directory.Build.props; the job refuses otherwise.
#
# Authentication is NuGet Trusted Publishing: the job presents its GitHub OIDC token to nuget.org and gets a
# short-lived API key back, so no NuGet credential is stored anywhere. nuget.org needs a Trusted Publishing policy
# for this repository and this workflow file (owner, repository, `release.yml`, environment `nuget`), and the
# repository variable NUGET_USER must hold the nuget.org username that owns that policy.
# The `nuget` environment carries required reviewers, so every publish waits for a person.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # lets the job request the OIDC token NuGet/login exchanges for a temporary key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check the tag matches Directory.Build.props
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          suffix=$(sed -n 's:.*<VersionSuffix>\(.*\)</VersionSuffix>.*:\1:p' Directory.Build.props)
          version="$prefix"; [ -n "$suffix" ] && version="$prefix-$suffix"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build --output artifacts
      - name: Sign in to nuget.org with the workflow's OIDC token
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
